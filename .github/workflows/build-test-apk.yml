name: Build Test APK

on:
  push:
    branches: [test-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omalauncher-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          gh release delete test-apk --yes --repo toniavanza/omalauncher 2>/dev/null || true
          git push origin :refs/tags/test-apk 2>/dev/null || true
          gh release create test-apk "$apk#omalauncher-test.apk" \
            --title "Omalauncher Test APK (Swipe Right Camera)" \
            --notes "APK de prueba con soporte de swipe a la derecha en panel 1 para la cámara (paquete dev.omalauncher.test, instalable en paralelo)." \
            --repo toniavanza/omalauncher
